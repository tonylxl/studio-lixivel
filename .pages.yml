# Configuration de Pages CMS (https://pagescms.org) : interface d'édition pour Cindy.
# Connexion sur app.pagescms.org avec le compte GitHub qui a accès au repo.

# Médiathèque : tout public/images (photos du site, dossiers journal/{article} créés depuis les réels, uploads).
media:
  input: public/images
  output: /images

content:
  - name: journal
    label: Blog
    type: collection
    path: content/journal
    filename: "{fields.titre}.md"
    view:
      fields: [titre, categorie, date, une]
      primary: titre
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: titre
        label: Titre (H1)
        type: string
        required: true
        options: { maxlength: 90 }
        description: "Reprendre la question que les gens tapent dans Google, ex. « Comment aménager un studio de 30 m² ? »."
      - name: categorie
        label: Catégorie
        type: select
        required: true
        options:
          values: [Petits espaces, Salon, Chambre, Cuisine, Petit budget, Rénovation, Avant / après]
      - { name: date, label: Date de publication, type: date, required: true }
      - name: duree
        label: Durée de lecture
        type: string
        pattern: { regex: "^$|^\\d+\\s?min$", message: "Format attendu : 6 min" }
        description: "Ex. 6 min (environ 200 mots par minute)."
      - { name: brouillon, label: "Brouillon (non publié : visible seulement par son lien)", type: boolean }
      - { name: une, label: Article à la une, type: boolean }
      - { name: vertical, label: "Photos verticales (article tiré d’un réel, format 4:5)", type: boolean }
      - { name: cover, label: Photo de couverture, type: image, required: true }
      - name: coverAlt
        label: Description de la photo
        type: string
        required: true
        options: { minlength: 15, maxlength: 200 }
        description: "Décrire ce qu’on voit, ex. « Cuisine blanche avec îlot en bois et deux tabourets roses ». Lu par Google et par les personnes malvoyantes."
      - name: chapo
        label: Chapô (introduction)
        type: text
        required: true
        options: { minlength: 100, maxlength: 350 }
        description: "2 ou 3 phrases qui répondent directement à la question du titre : c’est ce que reprennent Google et les IA."
      - name: reel
        label: Réel Instagram lié
        type: object
        fields:
          - name: url
            label: Lien du réel
            type: string
            pattern: { regex: "^$|^https://(www\\.)?instagram\\.com/", message: "Coller un lien Instagram (https://www.instagram.com/…)" }
          - { name: vignette, label: Vignette du réel, type: image }
          - { name: legende, label: Légende du réel, type: string }
      - name: produits
        label: La sélection du studio (produits)
        type: object
        list: true
        fields:
          - { name: titre, label: Nom du produit, type: string }
          - { name: prix, label: Prix, type: string }
          - { name: image, label: Photo, type: image }
          - name: lien
            label: Lien (affilié)
            type: string
            pattern: { regex: "^$|^https?://", message: "Le lien doit commencer par https://" }
      - { name: etiquettes, label: Étiquettes, type: string, list: true, description: "2 à 4 mots-clés, ex. Petits espaces, Rangement." }
      - name: seoTitle
        label: Titre pour Google (optionnel)
        type: string
        options: { maxlength: 60 }
        description: "60 caractères maximum, sinon Google le coupe. Vide = le titre de la page est repris."
      - name: seoDescription
        label: Description pour Google (optionnel)
        type: text
        pattern: { regex: "^$|^[\\s\\S]{110,160}$", message: "Entre 110 et 160 caractères, ou laisser vide." }
        options: { maxlength: 160 }
        description: "Le texte gris sous le titre dans Google. Entre 110 et 160 caractères, avec la requête principale et ce que le lecteur y gagne. Vide = le chapô est repris."
      - name: body
        label: Contenu
        type: rich-text
        description: "Intertitres en « Titre 2 ». Une citation devient l’encadré « Le conseil du studio ». Écrire [[produits]] seul sur une ligne pour placer la sélection."

  - name: reels
    label: Réels à transformer en article
    type: collection
    path: content/reels
    filename: "{year}-{month}-{day}-{fields.sujet}.md"
    view:
      fields: [sujet, statut, article]
      primary: sujet
    fields:
      - { name: sujet, label: Sujet en quelques mots, type: string, required: true, description: "Ex. « cuisine du studio à 10 000 € ». Sert seulement à retrouver la demande." }
      - name: url
        label: Lien du réel Instagram
        type: string
        required: true
        pattern: { regex: "^https://(www\\.)?instagram\\.com/(reel|reels|p)/", message: "Coller le lien d’un réel, ex. https://www.instagram.com/reel/…" }
      - { name: notes, label: "Consignes pour l’article (optionnel)", type: text, description: "Angle souhaité, infos à ajouter (ville, budget, marques des produits, liens), ce qu’il ne faut pas dire…" }
      - name: statut
        label: Statut
        type: select
        default: à traiter
        options:
          values: [à traiter, brouillon créé, erreur]
      - { name: article, label: "Article créé (rempli automatiquement)", type: string }

  - name: projets
    label: Projets
    type: collection
    path: content/projets
    filename: "{fields.titre}.md"
    view:
      fields: [titre, sousTitre, ville, annee]
      primary: titre
      sort: [ordre]
    fields:
      - { name: titre, label: Titre, type: string, required: true }
      - { name: sousTitre, label: Sous-titre (formule), type: string }
      - { name: ville, label: Ville, type: string }
      - { name: lieu, label: Lieu (fiche), type: string }
      - { name: annee, label: Année, type: number, required: true }
      - { name: ordre, label: Ordre d’affichage, type: number }
      - name: couleur
        label: Couleur d’ouverture
        type: select
        options:
          values: [rose, sauge, moutarde, lin, doux, ardoise]
      - { name: cover, label: Photo principale, type: image, required: true }
      - name: coverAlt
        label: Description de la photo
        type: string
        options: { maxlength: 200 }
        description: "Décrire ce qu’on voit, ex. « Bureau sur mesure en bois sous une fenêtre, chaise rouge ». Lu par Google et par les personnes malvoyantes."
      - { name: surface, label: Surface, type: string }
      - { name: formule, label: Formule, type: string }
      - { name: duree, label: Durée, type: string }
      - { name: budget, label: Budget indicatif, type: string }
      - { name: brief, label: "Le brief (rempli = page détail créée)", type: text }
      - { name: contraintes, label: Contraintes, type: string, list: true }
      - name: avant
        label: Avant
        type: object
        fields:
          - { name: image, label: Photo avant, type: image }
          - { name: legende, label: Légende, type: text }
      - name: apres
        label: Après
        type: object
        fields:
          - { name: image, label: Photo après, type: image }
          - { name: legende, label: Légende, type: text }
      - { name: plan, label: Plan 2D, type: image }
      - { name: rendu, label: Rendu 3D, type: image }
      - { name: realise, label: Photo du réalisé, type: image }
      - name: galerie
        label: Galerie
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image, required: true }
          - { name: alt, label: Description de la photo, type: string, options: { maxlength: 200 }, description: "Ce qu’on voit, ex. « Coin bureau en bois sous la fenêtre, chaise rouge ». Laisser vide : /textes-alt la proposera." }
      - name: shopping
        label: Liste shopping
        type: object
        list: true
        fields:
          - { name: piece, label: Pièce, type: string }
          - { name: ou, label: Où la trouver, type: string }
          - { name: prix, label: Prix, type: string }
      - name: avis
        label: Avis client
        type: object
        fields:
          - { name: texte, label: Citation, type: text }
          - { name: nom, label: Prénom, type: string }
          - { name: contexte, label: Contexte, type: string }

  - name: villes
    label: Pages villes
    type: collection
    path: content/villes
    filename: "{fields.nom}.md"
    view:
      fields: [nom, region, ordre]
      primary: nom
      sort: [ordre]
    fields:
      - { name: nom, label: Ville, type: string, required: true, description: "Le titre de la page sera « Architecte d’intérieur à … »." }
      - { name: region, label: Région, type: string }
      - { name: ordre, label: Ordre d’affichage, type: number }
      - name: couleur
        label: Couleur d’ouverture
        type: select
        options:
          values: [rose, sauge, moutarde, lin, doux, ardoise]
      - name: intro
        label: Introduction (en haut à droite)
        type: text
        required: true
        options: { maxlength: 220 }
        description: "2 phrases propres à la ville (pas un copier-coller d’une autre ville)."
      - { name: deplacement, label: "Comment le studio intervient dans cette ville", type: text }
      - { name: quartiers, label: Quartiers et communes, type: string, list: true }
      - name: faq
        label: Questions fréquentes de la ville
        type: object
        list: true
        fields:
          - { name: q, label: Question, type: string }
          - { name: r, label: Réponse, type: text }
      - name: seoTitle
        label: Titre pour Google (optionnel)
        type: string
        options: { maxlength: 60 }
        description: "60 caractères maximum, sinon Google le coupe. Vide = le titre de la page est repris."
      - name: seoDescription
        label: Description pour Google (optionnel)
        type: text
        pattern: { regex: "^$|^[\\s\\S]{110,160}$", message: "Entre 110 et 160 caractères, ou laisser vide." }
        options: { maxlength: 160 }
        description: "Le texte gris sous le titre dans Google. Entre 110 et 160 caractères, avec la requête principale et ce que le lecteur y gagne. Vide = le chapô est repris."
      - name: body
        label: Contenu propre à la ville
        type: rich-text
        description: "Important pour Google : un texte vraiment propre à la ville (types de logements, quartiers, façon d’intervenir). Intertitres en « Titre 2 »."

  - name: ressources
    label: Ressources (guides)
    type: collection
    path: content/ressources
    filename: "{fields.titre}.md"
    view:
      fields: [titre, statut, ordre]
      primary: titre
      sort: [ordre]
    fields:
      - { name: titre, label: Titre du guide, type: string, required: true, options: { maxlength: 60 } }
      - { name: description, label: Description, type: text, required: true, options: { maxlength: 260 }, description: "2 phrases : ce que contient le guide et à quoi il sert." }
      - { name: fichier, label: Fichier PDF, type: file, description: "Le guide à télécharger. Sans fichier, la carte s’affiche « Bientôt disponible »." }
      - { name: apercu, label: Aperçu de la couverture, type: image, description: "Image de la première page du guide (format A4 vertical)." }
      - { name: format, label: "Format affiché (ex. PDF · 4 pages)", type: string }
      - name: couleur
        label: Couleur de la carte
        type: select
        options:
          values: [rose, sauge, moutarde, lin, ardoise, doux]
      - name: statut
        label: Statut
        type: select
        default: bientôt
        options:
          values: [disponible, bientôt]
      - { name: ordre, label: Ordre d’affichage, type: number }

  # --- Réglages du site : textes et chiffres repris sur plusieurs pages (fichiers JSON dans content/donnees) ---

  - name: formules
    label: "Réglages · Formules et tarifs"
    type: file
    format: json
    path: content/donnees/formules.json
    fields:
      - name: formules
        label: Formules
        type: object
        list: true
        description: "Les 4 formules, dans l’ordre d’affichage. Les tarifs servent aussi au simulateur : penser à prévenir Tony pour mettre à jour le Google Sheet des demandes."
        fields:
          - { name: slug, label: "Identifiant (ne pas modifier)", type: string, readonly: true }
          - { name: titre, label: Nom de la formule, type: string, required: true }
          - { name: court, label: Nom court (simulateur), type: string, required: true }
          - { name: surtitre, label: "Surtitre (ex. 100 % à distance)", type: string }
          - { name: resume, label: Résumé (accueil et pages villes), type: text, required: true, options: { maxlength: 220 } }
          - { name: description, label: Description (page Services), type: text, required: true }
          - { name: inclus, label: Ce qui est inclus, type: string, list: true }
          - { name: delai, label: Délai, type: string, required: true }
          - { name: tarif, label: "Tarif affiché (ex. Dès 55 €/m²)", type: string, required: true }
          - { name: prixM2, label: "Tarif de base en €/m² (simulateur, vide pour un forfait)", type: number }
          - { name: minimum, label: "Forfait minimum en € (prise en charge complète)", type: number }
          - { name: noteTarif, label: Précision sous l’estimation du simulateur, type: string }
          - { name: modifs, label: Modifications, type: string }
          - { name: image, label: Image, type: image }
          - { name: illustration, label: "L’image est une illustration (fond coloré)", type: boolean }
      - name: comparatif
        label: Tableau comparatif (page Services)
        type: object
        list: true
        fields:
          - { name: label, label: Ligne, type: string, required: true }
          - { name: conseils, label: Conseils, type: string, description: "✓ ou — ou un texte court" }
          - { name: decoration, label: Décoration, type: string }
          - { name: semiComplete, label: Semi-complète, type: string }
          - { name: complete, label: Complète, type: string }
      - name: etapes
        label: Les étapes d’un projet (accueil, contact)
        type: object
        list: true
        fields:
          - { name: titre, label: Titre, type: string, required: true }
          - { name: texte, label: Texte, type: text, required: true, options: { maxlength: 160 } }
          - name: couleur
            label: Couleur de la carte
            type: select
            options:
              values: [sauge, rose, ardoise, moutarde, lin]

  - name: faq
    label: "Réglages · FAQ"
    type: file
    format: json
    path: content/donnees/faq.json
    fields:
      - name: categories
        label: Catégories
        type: object
        list: true
        fields:
          - { name: id, label: "Identifiant (ne pas modifier)", type: string, readonly: true }
          - { name: titre, label: Titre de la catégorie, type: string, required: true }
          - name: questions
            label: Questions
            type: object
            list: true
            fields:
              - { name: question, label: Question, type: string, required: true, description: "Formulée comme on la tape dans Google." }
              - { name: reponse, label: Réponse, type: text, required: true, description: "Commencer par la réponse directe en une phrase (c’est ce que reprennent Google et les IA), puis le détail. Pas de lien ni de bouton." }
              - { name: accueil, label: Afficher aussi sur l’accueil (4 questions max), type: boolean }
              - { name: services, label: Afficher aussi sur la page Services (5 questions max), type: boolean }

  - name: avis
    label: "Réglages · Avis clients"
    type: file
    format: json
    path: content/donnees/avis.json
    list: true
    fields:
      - { name: nom, label: Prénom, type: string, required: true }
      - { name: projet, label: "Projet (onglet, ex. Studio 14 m²)", type: string, required: true }
      - { name: contexte, label: "Contexte (ex. Studio 14 m² · Lille · Agencement & conseils)", type: string }
      - { name: texte, label: Avis, type: text, required: true, options: { maxlength: 260 } }
      - { name: avant, label: Photo avant, type: image, required: true }
      - { name: apres, label: Photo après, type: image, required: true }

  - name: presse
    label: "Réglages · Presse"
    type: file
    format: json
    path: content/donnees/presse.json
    list: true
    fields:
      - { name: nom, label: Média, type: string, required: true }
      - { name: titre, label: Titre de l’article ou de l’émission, type: string, required: true }
      - name: lien
        label: Lien
        type: string
        pattern: { regex: "^$|^https?://", message: "Le lien doit commencer par https://" }
        description: "Sans lien, le média n’apparaît pas sur la page Le studio. Le bandeau de logos de l’accueil se modifie avec Tony (fichier du logo)."

  - name: chiffres
    label: "Réglages · En chiffres"
    type: file
    format: json
    path: content/donnees/chiffres.json
    list: true
    fields:
      - { name: valeur, label: "Chiffre (ex. +60, 48 h)", type: string, required: true, options: { maxlength: 6 } }
      - { name: label, label: Légende, type: string, required: true, options: { maxlength: 50 } }
